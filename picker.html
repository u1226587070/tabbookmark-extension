<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TabBookmark</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;padding:10px}
.hdr{text-align:center;padding:6px 0 10px;font-size:13px;color:#888;border-bottom:1px solid #2a2a4a;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:background .1s}
.row:hover{background:#16213e}
.row.active{background:rgba(33,150,243,0.15);border-color:#2196f3;color:#fff}
.row.empty{opacity:0.35;cursor:default}
.row.empty:hover{background:transparent}
.num{width:22px;height:22px;background:#0f3460;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#64b5f6;font-weight:600;flex-shrink:0}
.tit{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ccc}
.row.active .tit{color:#fff}
.hint{text-align:center;font-size:10px;color:#555;margin-top:8px;padding-top:6px;border-top:1px solid #2a2a4a}
</style>
</head>
<body>
<div class="hdr">📑 书签栏</div>
<div id="list"></div>
<div class="hint">↑↓ 移动 · Enter 打开 · 1~9 跳转 · Esc 关闭</div>
<script src="picker.js"></script>
</body>
</html>
