<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TabBookmark</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;padding:10px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px;border-bottom:1px solid #2a2a4a;margin-bottom:6px}
.hdr-title{font-size:13px;color:#888}
.mode-switch{display:flex;gap:0}
.mode-btn{background:transparent;color:#555;border:1px solid #333;padding:4px 12px;font-size:11px;cursor:pointer;transition:all .15s;font-family:inherit}
.mode-btn:first-child{border-radius:4px 0 0 4px}
.mode-btn:last-child{border-radius:0 4px 4px 0}
.mode-btn.active{background:#2196f3;color:#fff;border-color:#2196f3}
.mode-btn:hover:not(.active){background:#16213e;color:#aaa}
#list{max-height:420px;overflow-y:auto}
#list::-webkit-scrollbar{width:4px}
#list::-webkit-scrollbar-track{background:transparent}
#list::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:background .1s}
.row:hover{background:#16213e}
.row.active{background:rgba(33,150,243,0.15);border-color:#2196f3;color:#fff}
.row.empty{opacity:0.35;cursor:default}
.row.empty:hover{background:transparent}
.num{width:22px;height:22px;background:#0f3460;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#64b5f6;font-weight:600;flex-shrink:0}
.tit{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ccc}
.row.active .tit,.row.active .num{color:#fff}
.hint{text-align:center;font-size:10px;color:#555;margin-top:6px;padding-top:6px;border-top:1px solid #2a2a4a}
</style>
</head>
<body>
<div class="hdr">
  <span class="hdr-title" id="modeTitle">📑 书签</span>
  <div class="mode-switch">
    <button class="mode-btn active" id="modeBookmark">🔖 书签</button>
    <button class="mode-btn" id="modeTab">📂 Tab</button>
  </div>
</div>
<div id="list"></div>
<div class="hint" id="hint">↑↓ 移动 · Enter 打开 · 按数字跳转 · Esc 关闭</div>
<script src="picker.js"></script>
</body>
</html>
