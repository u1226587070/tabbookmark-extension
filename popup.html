<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBookmark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2a4a;
      margin-bottom: 10px;
    }
    .step-box {
      background: #16213e;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .step-box h3 {
      font-size: 13px;
      color: #64b5f6;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .btn-guide {
      display: block;
      width: 100%;
      background: #4fc3f7;
      color: #0d1117;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      text-align: center;
    }
    .btn-guide:hover { background: #81d4fa; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    table th {
      text-align: left;
      color: #888;
      font-weight: 400;
      padding: 3px 6px;
      border-bottom: 1px solid #2a2a4a;
    }
    table td {
      padding: 4px 6px;
      border-bottom: 1px solid #222;
      color: #ccc;
    }
    table kbd {
      background: #0f3460;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      color: #64b5f6;
      font-family: inherit;
    }
    .btn-primary {
      display: block;
      width: 100%;
      background: #2196f3;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #1976d2; }
    .footer {
      margin-top: 8px;
      font-size: 10px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="title">📑 TabBookmark</div>

  <div id="mainContent">
    <div class="step-box">
      <h3>📋 第一步</h3>
      <button class="btn-guide" id="btnGuide">📖 打开设置引导页</button>
    </div>

    <div class="step-box">
      <h3>🔑 第二步：绑定 4 个快捷键</h3>
      <table>
        <tr><th>命令</th><th>按键</th><th>功能</th></tr>
        <tr><td>toggle-overlay</td><td><kbd>Ctrl+Shift+Space</kbd></td><td>显示/隐藏</td></tr>
        <tr><td>nav-left</td><td><kbd>Ctrl+Shift+,</kbd></td><td>左移</td></tr>
        <tr><td>nav-right</td><td><kbd>Ctrl+Shift+.</kbd></td><td>右移</td></tr>
        <tr><td>nav-open</td><td><kbd>Ctrl+Shift+O</kbd></td><td>打开</td></tr>
      </table>
    </div>

    <div class="step-box">
      <h3>🚀 第三步：试试</h3>
      <p style="font-size:12px;color:#ccc;margin-bottom:8px">还没配好也可以先试试浮层效果：</p>
      <button class="btn-primary" id="btnShow">📑 在当前页面显示书签浮层</button>
    </div>
  </div>

  <div class="footer">
    配好快捷键后按 <kbd>Ctrl+Shift+Space</kbd> 快速打开
  </div>

  <script src="popup.js"></script>
</body>
</html>
