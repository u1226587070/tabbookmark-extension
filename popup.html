<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBookmark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2a4a;
      margin-bottom: 10px;
    }
    .btn-show {
      display: block;
      width: 100%;
      background: #2196f3;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.15s;
    }
    .btn-show:hover { background: #1976d2; }
    .btn-show:active { background: #1565c0; }
    .btn-show .sub {
      font-size: 10px;
      opacity: 0.7;
    }
    .tip {
      background: #16213e;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 11px;
      line-height: 1.8;
      text-align: center;
    }
    .tip kbd {
      background: #0f3460;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      color: #64b5f6;
      font-family: inherit;
    }
    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      font-size: 12px;
      border-bottom: 1px solid #222;
    }
    .bookmark-item .index {
      width: 18px; height: 18px;
      background: #0f3460;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #64b5f6;
      flex-shrink: 0;
    }
    .bookmark-item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #ccc;
    }
    .bookmark-item .empty {
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="title">📑 TabBookmark</div>
  <button class="btn-show" id="btnShow">
    📑 在当前页面显示书签浮层
    <div class="sub">快捷键配好前先用这个试</div>
  </button>
  <div class="tip">
    <kbd>Ctrl+Shift+Space</kbd> 显示 · <kbd>Ctrl+Shift+,</kbd> <kbd>.</kbd> 左右 · <kbd>O</kbd> 打开
  </div>
  <div id="bookmarkItems">
    <div class="bookmark-item"><span class="index">1</span><span class="empty">加载中...</span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
