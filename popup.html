<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBookmark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .badge.tab { background: #2196f3; color: #fff; }
    .badge.bookmark { background: #4caf50; color: #fff; }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #16213e;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .toggle-label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-label .key-icon {
      font-size: 10px;
      background: #0f3460;
      padding: 2px 6px;
      border-radius: 4px;
      color: #888;
    }
    /* Switch toggle */
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #555;
      border-radius: 24px;
      transition: 0.3s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    input:checked + .slider { background: #4caf50; }
    input:checked + .slider::before { transform: translateX(20px); }

    .bookmark-list {
      border-top: 1px solid #2a2a4a;
      padding-top: 12px;
    }
    .bookmark-list-title {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
      border-bottom: 1px solid #222;
    }
    .bookmark-item .index {
      width: 18px;
      height: 18px;
      background: #0f3460;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #64b5f6;
      flex-shrink: 0;
    }
    .bookmark-item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #ccc;
    }
    .bookmark-item .empty {
      color: #666;
      font-style: italic;
    }
    .footer {
      margin-top: 14px;
      font-size: 10px;
      color: #555;
      text-align: center;
    }
    .footer kbd {
      background: #222;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">📑 TabBookmark</span>
    <span class="badge tab" id="modeBadge">Tab</span>
  </div>

  <div class="toggle-container">
    <div class="toggle-label">
      <span id="modeLabel">Tab 模式</span>
      <span class="key-icon">Ctrl+1~9</span>
      <span id="modeTarget">→ 切换标签页</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="modeToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="bookmark-list">
    <div class="bookmark-list-title">书签栏快捷访问</div>
    <div id="bookmarkItems">
      <div class="bookmark-item"><span class="index">1</span><span class="empty">加载中...</span></div>
    </div>
  </div>

  <div class="footer">
    <kbd>Ctrl+Shift+K</kbd> 切换模式 · 可在 <kbd>edge://extensions/shortcuts</kbd> 自定义快捷键
  </div>

  <script src="popup.js"></script>
</body>
</html>
